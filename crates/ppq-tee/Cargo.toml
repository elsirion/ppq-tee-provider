[package]
name = "ppq-tee"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Attested, end-to-end encrypted in-process client for PPQ.AI TEE models"

[features]
default = []
rig = ["dep:rig-core"]
# Exposes `ehbp::open::FrameSealer`, the EHBP *server* half of the response
# AEAD. Off by default: a client build has no business sealing responses. It
# lives beside the opener so the two derivations cannot drift apart, and is
# available to anyone writing an EHBP server or integration harness.
test-server = []

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
bytes = "1"
futures = "0.3"
flate2 = "1"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Sigstore bundle verification. `sigstore` 0.14 can only verify an artifact it can
# hash itself; we only ever hold the deployment's digest, so this crate family —
# which takes a pre-computed digest — is the one that fits. See the Task 4 report.
# `rustls` is not optional here: `reqwest` is an unconditional dependency of
# sigstore-rekor/-tsa, so leaving the TLS backend unselected would fall back to
# native-tls and pull in OpenSSL.
sigstore-verify = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-trust-root = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-types = { version = "0.11", default-features = false }
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }
# AMD attestation: the VCEK signs reports with ECDSA-P384, and every
# certificate in AMD's ARK -> ASK -> VCEK chain is signed with RSASSA-PSS
# (SHA-384, MGF1-SHA-384, 48-byte salt). Both crates are pure Rust.
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
const-oid = { version = "0.9", default-features = false }
# EHBP body encryption. All pure Rust (no OpenSSL). `aes` gives us AES-256-GCM
# for the HPKE suite, `getrandom` the OS CSPRNG used to encapsulate.
hpke = { version = "0.14", default-features = false, features = ["x25519", "alloc", "aes", "getrandom"] }
# The response AEAD is derived by hand (HPKE export -> HKDF), so we need
# AES-256-GCM and HKDF-SHA256 directly. `aes-gcm` is pinned to the same 0.11
# line `hpke` uses, so exactly one AES-GCM implementation is compiled in.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
rig-core = { version = "0.41", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
